[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hamsched"
version = "0.1.0"
description = "Measurement scheduling (shared-anchor vs independent pairs vs single interval) for recovering Hamiltonian vector fields from noisy observations"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "joblib", "PyYAML", "threadpoolctl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
