# Main study: double pendulum, fixed budgets of UNIQUE readings.  Grids fixed from Phase 0 / 0b
# (configs/phase0.yaml, results/phase0_*.csv) BEFORE Phase A; see reports/preregistration.md.
name: main_dp
system: {name: double_pendulum, e_max: -1.5, taper_start: 0.6}
seed: 20261119
kernel: se
threads: 10
eval:
  val: {n_traj: 150, n_states: 20, t_max: 9.5}     # oracle validation (clean, disjoint from test)
  test: {n_traj: 300, n_states: 20, t_max: 9.5}    # clean held-out test trajectories
budgets: [600, 1800]
noise_levels: [0.0, 0.001, 0.003, 0.01, 0.03, 0.1]   # sigma = a * z_rms (isotropic, Hu et al. convention)
reps: {tune: 2, test: 20}
# factor-sqrt(2) grid built so that 2*h is exactly on the grid (SI(h1), SI(2h1) are exact comparators);
# windows bracket the Phase 0 optima per noise level (pre-registered rule: edge selections are flagged).
h_grid:
  # (Amendment 2: one more doubling step at the top of every window after B600 edge selections)
  "0.0":   [0.0353555, 0.05, 0.070711, 0.1, 0.141422, 0.2, 0.282844, 0.4, 0.565688, 0.8]
  "0.001": [0.0353555, 0.05, 0.070711, 0.1, 0.141422, 0.2, 0.282844, 0.4, 0.565688, 0.8]
  "0.003": [0.05, 0.070711, 0.1, 0.141422, 0.2, 0.282844, 0.4, 0.565688, 0.8, 1.131376]
  "0.01":  [0.070711, 0.1, 0.141422, 0.2, 0.282844, 0.4, 0.565688, 0.8, 1.131376, 1.6]
  "0.03":  [0.1, 0.141422, 0.2, 0.282844, 0.4, 0.565688, 0.8, 1.131376, 1.6]
  "0.1":   [0.141422, 0.2, 0.282844, 0.4, 0.565688, 0.8, 1.131376, 1.6]
  default: [0.05, 0.1, 0.2, 0.4, 0.8]
# Lengthscale multipliers of the training-reading spread and per-sample relative ridge, per budget and
# noise level.  B1800 windows bracket the Phase 0/0b optima.  B600 windows were shifted up after the
# first (aborted) Phase A pass selected the upper edge of every B600 window (fewer points prefer smoother
# fits); that pass was discarded before any lock or test run (edge rule, see reports/preregistration.md).
ells:
  B1800:   # (Amendment 3: lower values added at a in {0, 0.003, 0.01} after lower-edge selections)
    "0.0":   [0.65, 0.8, 1.0, 1.25]
    "0.001": [0.9, 1.15, 1.45]
    "0.003": [0.85, 1.1, 1.4]
    "0.01":  [0.9, 1.15, 1.5]
    "0.03":  [1.0, 1.3, 1.7]
    "0.1":   [1.15, 1.5, 2.0]
    default: [1.0, 1.3]
  B600:
    "0.0":   [1.0, 1.3, 1.7]
    "0.001": [1.15, 1.5, 1.9]
    "0.003": [1.4, 1.8, 2.3]
    "0.01":  [1.5, 2.0, 2.6]
    "0.03":  [1.3, 1.7, 2.2, 2.8]
    "0.1":   [1.5, 2.0, 2.6, 3.3]
    default: [1.3, 1.7]
etas:
  B1800:   # (Amendment 3: one lower decade at a in {0.001, 0.003}; 1e-11 at a = 0 is a float64 conditioning floor)
    "0.0":   [1.0e-11, 1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7]
    "0.001": [1.0e-11, 1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6]
    "0.003": [1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5]
    "0.01":  [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4]
    "0.03":  [1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]
    "0.1":   [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
    default: [1.0e-8, 1.0e-6, 1.0e-4]
  B600:    # (Amendment 3: two upper decades at a = 0)
    "0.0":   [1.0e-11, 1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4]
    "0.001": [1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5]
    "0.003": [1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4]
    "0.01":  [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3]
    "0.03":  [1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
    "0.1":   [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
    default: [1.0e-8, 1.0e-6, 1.0e-4]
h_min: [0.1, 0.2, 0.4]          # instrument minimum-interval constraints (validation-only constrained locks)
# evaluated at every grid h in Phase B (cheap); all others at their own and sibling selections +-1 grid step
test_all_h: [[SI, MP], [SA, RICH], [IP, RICH], [RA, RICH]]
plans:
  - {plan: SI,  estimators: [MP, DC]}
  - {plan: SA,  estimators: [POOL, RICH, LONG]}
  - {plan: IP,  estimators: [POOL, RICH]}
  - {plan: RA,  estimators: [RICH]}
  - {plan: MS3, estimators: [RICH]}
  - {plan: SA,  estimators: [GLS], cells: [[1800, 0.003], [1800, 0.03]]}
