# Non-oracle schedule selection from a calibration set counted in the budget (B_cal = 264 of 1800, 14.7%).
# Candidates/defaults fixed BEFORE Phase B from Phase 0 (no test information).
main_config: configs/main_dp.yaml
noise_levels: [0.003, 0.03]
B: 1800
B_cal: 264            # 88 calibration triplets (0, h_c, 2 h_c); remaining 1536 is divisible by 2, 3, 4
h_c: 0.2
reps: 8
surrogate_reps: 2
ells: {"0.003": [1.1, 1.4], "0.03": [1.3, 1.7]}
etas: {"0.003": [1.0e-8, 1.0e-7, 1.0e-6], "0.03": [1.0e-6, 1.0e-5, 1.0e-4]}
candidates:
  - {plan: SI,  est: MP,   h1: 0.2}
  - {plan: SI,  est: MP,   h1: 0.4}
  - {plan: SI,  est: DC,   h1: 0.4}
  - {plan: MS3, est: RICH, h1: 0.2}
  - {plan: MS3, est: RICH, h1: 0.4}
  - {plan: SA,  est: RICH, h1: 0.4}
defaults:              # no calibration, full budget, (ell, eta) by 2-fold rollout CV on the training data
  SI-MP_h0.2:   {plan: SI,  est: MP,   h1: 0.2}
  MS3-RICH_h0.2: {plan: MS3, est: RICH, h1: 0.2}
oracle:                # oracle-validation locks of main_dp (not implementable; upper reference)
  SI-MP:    {plan: SI,  est: MP}
  SI-DC:    {plan: SI,  est: DC}
  MS3-RICH: {plan: MS3, est: RICH}
  SA-RICH:  {plan: SA,  est: RICH}
