# Implementation anchor against Hu et al. (arXiv:2610.17835) Sec. 6.1-6.2: Henon-Heiles, E < 0.14,
# N = 1000 single-step pairs (L = 1), noise-free, Matern-5/2 with ell = 3 (raw coordinates), eta = 1e-9,
# delta in [0.08, 0.30].  Their reported fitted slope for MP is ~2.03 (Hamiltonian error on a 2-D slice);
# we report the relative vector-field error on held-out trajectories, so only the slope is comparable.
name: hh_anchor
system: {name: henon_heiles, e_max: 0.14}
seed: 20261119
kernel: se
threads: 10
eval:
  val: {n_traj: 150, n_states: 20, t_max: 9.5}
  test: {n_traj: 300, n_states: 20, t_max: 9.5}
hh:
  N: 1000
  deltas: [0.08, 0.1, 0.12, 0.15, 0.2, 0.25, 0.3]
  hu_ell: 3.0
  hu_eta: 1.0e-9
  se_ells: [0.6, 0.9, 1.3]
  se_etas: [1.0e-12, 1.0e-10, 1.0e-8, 1.0e-6]
