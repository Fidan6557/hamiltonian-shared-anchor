# Phase 0 (exploratory; separate seeds, purpose 'phase0').  Used ONLY to fix grids, E_max check,
# timings and the pre-registered predictions before Phase A.  Not used for any reported comparison.
name: phase0
system: {name: double_pendulum, e_max: -1.5, taper_start: 0.6}
seed: 20261119
kernel: se
threads: 10
eval:
  val: {n_traj: 150, n_states: 20, t_max: 9.5}
  test: {n_traj: 300, n_states: 20, t_max: 9.5}
budgets: [1800]
noise_levels: [0.0, 0.003, 0.01, 0.03, 0.1]
h_grid: [0.05, 0.1, 0.2, 0.4, 0.8]
ells: [0.6, 0.9, 1.3]
etas: [1.0e-10, 1.0e-8, 1.0e-6, 1.0e-4, 1.0e-3, 1.0e-2]
plans:
  - {plan: SI, estimators: [MP, DC]}
  - {plan: SA, estimators: [RICH]}
  - {plan: MS3, estimators: [RICH]}
  - {plan: IP, estimators: [RICH]}
floor:
  n: [300, 450, 600, 900, 1200]
  ells: [0.6, 0.8, 1.0, 1.3]
  etas: [1.0e-10, 1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6]
